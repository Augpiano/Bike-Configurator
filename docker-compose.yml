services:
  frontend:
    build:
      context: .
      dockerfile: front/Dockerfile 
    networks:
      - app-net
    healthcheck:
      disable: false
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: back/Dockerfile
    networks:
      - app-net
      - database-net
    healthcheck:
      disable: false
    restart: unless-stopped

  # database:

  # reverse-roxy:
  proxy:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    #   - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-net
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

networks:
  app-net:
    driver: bridge
  database-net:
    internal: true